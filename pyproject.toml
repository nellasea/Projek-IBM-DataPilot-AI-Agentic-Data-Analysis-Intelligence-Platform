[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot-ai"
version = "0.1.0"
description = "Agentic Data Analysis & Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    # Web / API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "duckdb>=0.10",
    # LLM / Agent
    "langgraph>=0.1",
    # LangGraph uses langchain-core transitively; no external LLM SDK is needed.
    # Stats / ML
    "scipy>=1.13",
    "scikit-learn>=1.4",
    # Visualisation
    "plotly>=5.22",
    # UI
    "streamlit>=1.35",
    # Persistence
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "agent*", "core*", "data*", "llm*", "tools*", "ui*", "eval*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
